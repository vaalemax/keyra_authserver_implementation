spring:
  application:
    name: keyra_x_authserver

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/keyra_x_authserver}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:user}
    driver-class-name: org.postgresql.Driver

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      location: ${java.io.tmpdir}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      client:
        registration:
          keyra:
            client-id: keyra-web
            client-secret: ${KEYRA_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
        provider:
          keyra:
            issuer-uri: http://localhost:9000/keyra

server:
  port: 8081

  servlet:
    session:
      timeout: 30m
      tracking-modes:
        - cookie
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
        name: KEYRA_SESSION

logging:
  level:
    root: INFO
    com.portfolio.keyra: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

  file:
    name: logs/pswmanager.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p --- [%t] %-40.40logger{39} : %m%n%wEx"

rate-limit:
  strict:
    capacity: 5
  normal:
    capacity: 10
  window:
    ms: 60000

audit-log:
  retention-days: 90